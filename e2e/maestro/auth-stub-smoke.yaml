appId: com.ekasc.aoi
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
- runFlow:
    when:
      visible: "This is the developer menu. It gives you access to useful tools in your development builds."
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Set up your shared space"
    timeout: 120000
- runFlow:
    when:
      visible: "Continue with Google"
    commands:
      - tapOn: "Continue with Google"
- assertVisible: "Set up your shared space"
- assertVisible: "Step 1 of 3"
